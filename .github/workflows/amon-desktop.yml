name: Amon desktop

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build all platforms, or only one target after fixing a failure
        type: choice
        default: all
        options: [all, windows-x64, windows-arm64, linux-x64, linux-arm64, macos-x64, macos-arm64]
      release:
        description: Create a draft GitHub Release after all builds pass
        type: boolean
        default: false
  push:
    tags: ["amon-v*"]

permissions:
  contents: read

concurrency:
  group: amon-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          BUILD_TARGET: ${{ inputs.target || 'all' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const declared = JSON.parse(readFileSync('package.json', 'utf8')).version
          const tagged = process.env.RELEASE_REF.startsWith('refs/tags/amon-v')
          const version = tagged ? process.env.RELEASE_REF.slice('refs/tags/amon-v'.length) : declared
          if (!/^\d+\.\d+\.\d+(?:-[\w.-]+)?$/.test(version)) throw new Error('Invalid release version')
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=amon-v${version}\n`)
          const targets = [
            {runner: 'windows-2025', name: 'windows-x64', target: 'x86_64-pc-windows-msvc'},
            {runner: 'windows-2025', name: 'windows-arm64', target: 'aarch64-pc-windows-msvc'},
            {runner: 'ubuntu-24.04', name: 'linux-x64', target: 'x86_64-unknown-linux-gnu'},
            {runner: 'ubuntu-24.04-arm', name: 'linux-arm64', target: 'aarch64-unknown-linux-gnu'},
            {runner: 'macos-15-intel', name: 'macos-x64', target: 'x86_64-apple-darwin'},
            {runner: 'macos-15', name: 'macos-arm64', target: 'aarch64-apple-darwin'},
          ].filter(item => process.env.BUILD_TARGET === 'all' || item.name === process.env.BUILD_TARGET)
          if (!targets.length) throw new Error('Unknown build target')
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include: targets})}\n`)
          JS

  check:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    needs: [version, check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    env:
      AMON_CHANNEL: prod
      AMON_VERSION: ${{ needs.version.outputs.version }}
      AMON_CLI_TARGET: ${{ matrix.target }}
      AMON_UPDATE_URL: ${{ vars.AMON_UPDATE_URL }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK == '' && 'false' || 'true' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libfuse2
      - name: Install dependencies for host and packaging target
        run: bun install --frozen-lockfile --cpu="*"
      - name: Test development lock and package contracts
        working-directory: packages/desktop
        run: bun test scripts/dev-instance.test.ts electron-builder.config.test.ts electron.vite.config.test.ts
      - name: Compile engine, desktop and installers
        run: npm run package:desktop
      - name: Verify native engine lifecycle
        if: matrix.name != 'windows-arm64'
        working-directory: packages/cli
        env:
          AMON_CLI_TARGET: ${{ matrix.name == 'windows-x64' && 'cli-windows-x64-baseline' || matrix.name == 'linux-x64' && 'cli-linux-x64-baseline' || matrix.name == 'linux-arm64' && 'cli-linux-arm64' || matrix.name == 'macos-x64' && 'cli-darwin-x64-baseline' || 'cli-darwin-arm64' }}
        run: bun run script/service-smoke.ts
      - uses: actions/upload-artifact@v4
        with:
          name: amon-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/amon-desktop-*.exe
            packages/desktop/dist/amon-desktop-*.dmg
            packages/desktop/dist/amon-desktop-*.zip
            packages/desktop/dist/amon-desktop-*.AppImage
            packages/desktop/dist/amon-desktop-*.deb
            packages/desktop/dist/amon-desktop-*.rpm
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml

  release:
    if: startsWith(github.ref, 'refs/tags/amon-v') || (inputs.release && inputs.target == 'all')
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: amon-desktop-*
          path: artifacts
      - name: Create draft release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          printf 'Amon %s desktop packages for Windows, Linux and macOS.\n' "$RELEASE_VERSION" > release-notes.md
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --target "$RELEASE_COMMIT" --title "Amon $RELEASE_VERSION" --notes-file release-notes.md
          find artifacts -type f -name 'amon-desktop-*' -print0 | xargs -0 -r gh release upload "$RELEASE_TAG" --clobber
