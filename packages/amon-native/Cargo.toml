[package]
name = "amon_native"
version = "2.0.27"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
goblin = "0.10.3"
napi = { version = "3.4.0", default-features = false, features = ["napi8"] }
napi-derive = "3.3.0"
sha2 = "0.10.9"

[build-dependencies]
napi-build = "2.3.1"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "abort"
